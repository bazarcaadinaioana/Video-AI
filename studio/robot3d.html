<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script src="../lib/personaggi.js"></script>
</head><body>
<script type="module">
// "Nova": assistente AI in 3D. Testa bianca lucida, visiera a specchio, occhi luminosi
// e bocca a equalizzatore che segue la voce. Sfondo trasparente.
import * as THREE from "three";
import { RoomEnvironment } from "./vendor/RoomEnvironment.js";
import { RoundedBoxGeometry } from "./vendor/RoundedBoxGeometry.js";

const P = new URLSearchParams(location.search);
const Wd = +(P.get("w") || 600), Ht = +(P.get("h") || 690);
const GLOW = new THREE.Color(P.get("glow") || "#6be4ff");
const GOLD = new THREE.Color(P.get("accent") || "#ffc21a");

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(Wd, Ht); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(28, Wd / Ht, 0.1, 100);
camera.position.set(0, -0.1, 7.4); camera.lookAt(0, -0.45, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(GLOW, 3.2); rim.position.set(4, 2, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xffe2b0, 1.4); rim2.position.set(-4, 1, -3); scene.add(rim2);

const white = new THREE.MeshPhysicalMaterial({ color: 0xf3f5f9, roughness: 0.28, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.06 });
const visorM = new THREE.MeshPhysicalMaterial({ color: 0x04060c, roughness: 0.18, metalness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 0.25 });
const goldM = new THREE.MeshStandardMaterial({ color: GOLD, metalness: 1, roughness: 0.22 });
const darkM = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, metalness: 1, roughness: 0.32 });
const glowM = new THREE.MeshBasicMaterial({ color: GLOW, toneMapped: false });

const root = new THREE.Group(); scene.add(root);
const head = new THREE.Group(); head.position.y = 0.35; root.add(head);

// testa
const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), white); skull.scale.set(1.0, 0.93, 0.96); head.add(skull);
// visiera: calotta frontale
const visor = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 48, Math.PI / 2 - 0.82, 1.64, Math.PI / 2 - 0.5, 0.95), visorM);
visor.scale.set(1.025, 0.955, 0.985); head.add(visor);
// cornice della visiera
const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.012, 8, 120, Math.PI), goldM);
rimRing.rotation.set(0, 0, 0); rimRing.visible = false; head.add(rimRing);

// punto sulla visiera (angolo orizzontale a, verticale b) e orientamento verso l'esterno
function onVisor(obj, a, b, r = 1.0) {
  const x = Math.sin(a) * Math.cos(b), y = Math.sin(b), z = Math.cos(a) * Math.cos(b);
  obj.position.set(x * 1.025 * r, y * 0.955 * r, z * 0.985 * r);
  obj.lookAt(obj.position.clone().multiplyScalar(2)); head.add(obj); return obj;
}
// occhi
const eyes = [-1, 1].map(s => onVisor(new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.13, 8, 16), glowM), s * 0.36, 0.16, 1.006));
// alone degli occhi
const haloTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "rgba(255,255,255,0.9)"); gr.addColorStop(0.3, "rgba(255,255,255,0.25)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const halos = eyes.map(e => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.7 })); s.scale.set(0.55, 0.55, 1); s.position.copy(e.position).multiplyScalar(1.01); head.add(s); return s; });
// bocca: equalizzatore
const NB = 9, bars = [];
for (let k = 0; k < NB; k++) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(0.045, 1, 0.03, 2, 0.02), glowM);
  bars.push(onVisor(m, (k - (NB - 1) / 2) * 0.075, -0.2, 1.006));
}
// orecchie
for (const s of [-1, 1]) {
  const ear = new THREE.Group(); ear.position.set(s * 0.985, 0.02, 0); ear.rotation.y = s * Math.PI / 2; head.add(ear);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.045, 24, 64), goldM); ear.add(ring);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 48), white); disc.rotation.x = Math.PI / 2; ear.add(disc);
  const led = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 48), glowM); led.position.z = 0.035; ear.add(led);
}
// collo e busto
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.34, 0.32, 48), darkM); neck.position.y = -0.62; root.add(neck);
const collar = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.035, 16, 64), goldM); collar.rotation.x = Math.PI / 2; collar.position.y = -0.76; root.add(collar);
const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), white); torso.scale.set(1.45, 0.75, 0.8); torso.position.y = -1.62; root.add(torso);
const chest = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.025, 12, 64), glowM); chest.position.set(0, -1.3, 0.735); chest.rotation.x = -0.5; root.add(chest);
const chestDot = new THREE.Mesh(new THREE.CircleGeometry(0.07, 32), glowM); chestDot.position.set(0, -1.3, 0.737); chestDot.rotation.x = -0.5; root.add(chestDot);


let LIP = [];
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function blink(t) { const k = Math.floor(t / 3.4), ph = t - k * 3.4 - hash(k) * 1.5; return ph > 0 && ph < 0.15 ? Math.sin(ph / 0.15 * Math.PI) : 0; }

window.setLip = arr => { LIP = arr; };
window.computeLip = async (b64, fps) => {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const buf = await new OfflineAudioContext(1, 24000, 24000).decodeAudioData(bytes.buffer);
  LIP = Personaggi.lipsync(buf.getChannelData(0), buf.sampleRate, fps); return LIP.length;
};
window.frame = (i, fps) => {
  const t = i / fps, L = LIP[Math.min(LIP.length - 1, i)] || { o: 0, r: 0 }, o = L.o;
  head.rotation.y = Math.sin(t * 0.55) * 0.16 + Math.sin(t * 1.7) * 0.03;
  head.rotation.x = -0.04 + Math.sin(t * 1.1) * 0.035 + o * 0.06 * Math.sin(t * 7);
  head.rotation.z = Math.sin(t * 0.8) * 0.035;
  root.position.y = Math.sin(t * 1.3) * 0.03;
  const bl = blink(t); eyes.forEach((e, k) => { e.scale.set(1, Math.max(0.08, 1 - bl) * (1 + o * 0.08), 1); halos[k].material.opacity = 0.55 + o * 0.35; });
  bars.forEach((b, k) => {
    const c = 1 - Math.abs(k - (NB - 1) / 2) / ((NB - 1) / 2 + 0.6);
    const jit = 0.6 + 0.4 * Math.abs(Math.sin(t * 17 + k * 1.9) * Math.cos(t * 11 + k));
    b.scale.y = 0.035 + o * 0.32 * c * jit;
  });
  chestDot.material.color.copy(GLOW).multiplyScalar(0.7 + 0.3 * Math.sin(t * 3));
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png").split(",")[1];
};
window.READY = true;
</script>
</body></html>
